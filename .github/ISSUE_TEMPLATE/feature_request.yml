name: Feature request
description: Suggest an idea or enhancement for RoomTask
title: "[FEATURE]: "
labels: ["enhancement", "good first issue"]
body:
  - type: markdown
    attributes:
      value: Thanks for contributing to RoomTask! Please describe your suggested feature below.
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear and concise description of what you'd like to see added.
    validations:
      required: true
  - type: textarea
    id: beginner-friendly
    attributes:
      label: Beginner Context
      description: How does this make the project better or easier for beginners?
